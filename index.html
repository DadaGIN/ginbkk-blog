---
layout: default
---
{% for post in site.posts %}
<a href="{{ post.url | relative_url }}" class="item">
  <div class="badge">{{ post.category }}</div>
  <div>
    <div class="meta">{{ post.date | date: "%Y.%m.%d" }} ｜ {{ post.tags | join: "・" }}</div>
    <h2 class="title">{{ post.title }}</h2>
    <p class="desc">{{ post.excerpt | strip_html | truncate: 80 }}</p>
  </div>
</a>
{% endfor %}
